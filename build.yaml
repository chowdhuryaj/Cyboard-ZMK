# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # Central half: raw_hid_adapter (zzeneg/zmk-raw-hid) carries the Flask
  # tuning protocol's HID device; the studio snippet + config enable live
  # keymap editing over ZMK Studio's USB-serial RPC (plus BLE GATT, which
  # needs no snippet).
  #
  # STUDIO_LOCKING=n (2026-07-15, AJ's ask): Studio boots UNLOCKED and never
  # re-locks, so &studio_unlock is no longer needed to edit the keymap.
  # &studio_unlock stays bound (control layer, position 67 — RIGHT thumb) and
  # is simply a no-op now.
  #
  # Why: unlock is PHYSICAL-ONLY by design and there is no way around it —
  # core.proto has a `lock` RPC but no `unlock`, and every keymap RPC plus
  # get_behavior_details is SECURED, so a locked board cannot even be read.
  # With only the LEFT half at work, position 67 is unreachable and the
  # keymap is uneditable.
  #
  # ⚠ TRADEOFF: the lock exists so a random web page with WebSerial access
  # cannot rewrite the keymap without a physical confirmation. Off = it can.
  # ZMK implies locking ON for real hardware; this explicitly overrides that
  # (`imply` is a weak default, so an explicit =n wins). Revert by dropping
  # this flag.
  #
  # Studio only runs on central, so this flag only belongs here — the LEFT
  # half alone carries it, and flashing just the left half applies it.
  - board: assimilator-bt
    shield: imprint_left raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  # Peripheral half: its strip sits after the central's 35 LEDs in the
  # global flask_rgb index space (bench paint-sweep confirms the counts).
  # Named "Imprint R" so a Mac Bluetooth list can tell it from the central
  # — pairing a HOST to this half never completes (it only accepts the
  # split central), which reads as a "stuck connecting" loop. Pair the
  # LEFT half's entry. The name is cosmetic to the split link itself.
  - board: assimilator-bt
    shield: imprint_right
    cmake-args: -DCONFIG_ZMK_FLASK_RGB_LED_OFFSET=35 -DCONFIG_ZMK_KEYBOARD_NAME='"Imprint R"'
  # Hang-capture central: USB console logging instead of the Studio CDC
  # snippet (one CDC each — they'd fight over the port; the logging
  # snippet also provides the cdc_acm_uart DT node the bare Kconfig
  # lacks). Flash this LEFT-half image only when chasing a freeze/crash:
  #   tio $(ls /dev/tty.usbmodem* | head -1)     # then reproduce
  # Flask HID, keymap and split all behave like the normal central build;
  # reflash the normal image when done.
  - board: assimilator-bt
    shield: imprint_left raw_hid_adapter
    snippet: zmk-usb-logging
    # Immediate mode: a hard hang never flushes deferred log buffers — the
    # tail before the freeze is the whole point of this image.
    cmake-args: -DCONFIG_LOG_MODE_IMMEDIATE=y
    artifact-name: imprint_left_logging
  # Stored-state differential (bench 4b: both halves die ~30-45 s after
  # boot with NO app attached — every bench has grown the settings
  # partition, and settings survive reflashing). Flash these ONCE per half
  # (they wipe settings + bonds and sit in a blinking no-op), then flash
  # the normal images back and re-pair. Crash gone afterwards = the
  # trigger lives in stored state, and we bisect settings keys next.
  # (stacked on imprint_left: the board DT leans on shield pinctrl, so a
  # bare settings_reset shield does not build. The kscan chosen is
  # overridden by settings_reset, which is the part that matters — flash
  # this SAME image to EACH half in turn.)
  - board: assimilator-bt
    shield: imprint_left settings_reset
    artifact-name: imprint_settings_reset
