# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  # Central half: raw_hid_adapter (zzeneg/zmk-raw-hid) carries the Flask
  # tuning protocol's HID device; the studio snippet + config enable live
  # keymap editing over ZMK Studio's USB-serial RPC (plus BLE GATT, which
  # needs no snippet). &studio_unlock is on the control layer.
  - board: assimilator-bt
    shield: imprint_left raw_hid_adapter
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  # Peripheral half: its strip sits after the central's 35 LEDs in the
  # global flask_rgb index space (bench paint-sweep confirms the counts).
  - board: assimilator-bt
    shield: imprint_right
    cmake-args: -DCONFIG_ZMK_FLASK_RGB_LED_OFFSET=35
  # Hang-capture central: USB console logging instead of the Studio CDC
  # snippet (one CDC each — they'd fight over the port; the logging
  # snippet also provides the cdc_acm_uart DT node the bare Kconfig
  # lacks). Flash this LEFT-half image only when chasing a freeze/crash:
  #   tio $(ls /dev/tty.usbmodem* | head -1)     # then reproduce
  # Flask HID, keymap and split all behave like the normal central build;
  # reflash the normal image when done.
  - board: assimilator-bt
    shield: imprint_left raw_hid_adapter
    snippet: zmk-usb-logging
    # Immediate mode: a hard hang never flushes deferred log buffers — the
    # tail before the freeze is the whole point of this image.
    cmake-args: -DCONFIG_LOG_MODE_IMMEDIATE=y
    artifact-name: imprint_left_logging
  # Stored-state differential (bench 4b: both halves die ~30-45 s after
  # boot with NO app attached — every bench has grown the settings
  # partition, and settings survive reflashing). Flash these ONCE per half
  # (they wipe settings + bonds and sit in a blinking no-op), then flash
  # the normal images back and re-pair. Crash gone afterwards = the
  # trigger lives in stored state, and we bisect settings keys next.
  - board: assimilator-bt
    shield: settings_reset
    artifact-name: imprint_settings_reset
