# RGB: flask_rgb (per-key per-layer runtime map, channel 0x21) owns the
# strip since 2026-07-09 — RGB_UNDERGLOW must stay OFF (both would drive
# the same LEDs). GOTCHA: with underglow off nothing else enables
# LED_STRIP, and flask_rgb's dependency on it goes silently unmet (build
# stays green, no RGB) — so enable it here. The ws2812 SPI driver
# self-enables from the DT compatible (Zephyr 4.1 has no WS2812_STRIP
# umbrella symbol; the shield's `imply WS2812_STRIP` is a fossil).
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP=y
CONFIG_ZMK_FLASK_RGB=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# BLE mouse host (tadakado/zmk-ble-mouse-host): central holds split peripheral
# + mouse + BLE host simultaneously; ATT pool must cover mouse GATT discovery.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=8
CONFIG_BT_ATT_TX_COUNT=8

# Flask runtime-tuning protocol over raw HID (zmk-flask-modules). RAW_HID
# itself comes from the raw_hid_adapter shield on the left/central build;
# this stays inert on the right half.
CONFIG_ZMK_FLASK_PROTO=y

# Flask runtime combos (channel 0x24; proto v7) — the live-editable analog
# of the keymap's devicetree combos. Central-only source; the module has no
# DT node, so the symbol is set here explicitly. Runtime slots get first
# look at position events (module links before app), DT combos see whatever
# they release — a runtime slot on the same positions shadows the DT combo.
CONFIG_ZMK_FLASK_COMBOS=y

CONFIG_ZMK_ADAPTIVE_KEY_MAX_BINDINGS=6

# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Faster event delivery
CONFIG_PMW3610_REPORT_INTERVAL_MIN=0

# Keep the sensor out of deeper sleep states longer
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=30000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=120000

# Faster polling when it does reach rest states
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=50
