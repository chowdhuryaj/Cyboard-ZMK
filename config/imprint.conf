# RGB: flask_rgb (per-key per-layer runtime map, channel 0x21) owns the
# strip since 2026-07-09 — RGB_UNDERGLOW must stay OFF (both would drive
# the same LEDs). GOTCHA: with underglow off nothing else enables
# LED_STRIP, and flask_rgb's dependency on it goes silently unmet (build
# stays green, no RGB) — so enable it here. The ws2812 SPI driver
# self-enables from the DT compatible (Zephyr 4.1 has no WS2812_STRIP
# umbrella symbol; the shield's `imply WS2812_STRIP` is a fossil).
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_LED_STRIP=y
CONFIG_ZMK_FLASK_RGB=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Crash forensics: meta 0x04 answers the boot reset-cause bits (software /
# CPU lockup / watchdog reads as a fault-reboot after a bench "crash").
CONFIG_HWINFO=y

# (BLE mouse host removed 2026-07-12 — stock ZMK BT connection defaults.)

# Flask runtime-tuning protocol over raw HID (zmk-flask-modules). RAW_HID
# itself comes from the raw_hid_adapter shield on the left/central build;
# this stays inert on the right half.
CONFIG_ZMK_FLASK_PROTO=y

# Flask runtime combos (channel 0x24; proto v7) — the live-editable analog
# of the keymap's devicetree combos. Central-only source; the module has no
# DT node, so the symbol is set here explicitly. Runtime slots get first
# look at position events (module links before app), DT combos see whatever
# they release — a runtime slot on the same positions shadows the DT combo.
CONFIG_ZMK_FLASK_COMBOS=y

# Flask runtime macros (channel 0x25; proto v8) — live-editable macros,
# the Vial dynamic-macros analog (ZMK's DT macros are const and Studio has
# no macro RPC). Engine symbol set explicitly (central-only source, like
# combos); the &fmac keymap node auto-enables just the behavior on top of
# it. Capacities are Kconfig since v9 (defaults: 32 slots x 32 steps;
# combos 64 slots x 8 keys) — persisted per-slot, so the settings
# partition is the real bound. flask_accel + flask_scrollsnap (also v9)
# self-enable from their keymap DT nodes.
CONFIG_ZMK_FLASK_MACROS=y

# Flask runtime leader (channel 0x19; proto v10) — app-edited position
# sequences firing a usage tap or a flask_macros slot. Engine symbol set
# explicitly (central-only source, like combos/macros); the &fled keymap
# node auto-enables just the behavior. urob's compile-time &leader
# (email/USB/BLE) is unaffected. flask_gestures (also v10) self-enables
# from its keymap DT node.
CONFIG_ZMK_FLASK_LEADER=y

# Custom shift keys (channel 0x16; proto v14) — QMK custom_shift_keys
# analog: shift+key sends a runtime-mapped replacement (⇧, → ; ⇧⌫ → ⌦)
# with the held shift masked. Keycode-event hook, central-only source, no
# DT node — symbol set here explicitly.
CONFIG_ZMK_FLASK_CSK=y

# Runtime tap dances (channel 0x28; proto v14) — &ftd <slot> runs an
# app-edited dance (per-slot term + typed output per tap count). Engine
# symbol set explicitly (central-only source); the &ftd keymap node
# auto-enables just the behavior.
CONFIG_ZMK_FLASK_TAPDANCE=y

CONFIG_ZMK_ADAPTIVE_KEY_MAX_BINDINGS=6

# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Faster event delivery
CONFIG_PMW3610_REPORT_INTERVAL_MIN=0

# Keep the sensor out of deeper sleep states longer
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=30000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=120000

# Faster polling when it does reach rest states
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=50
