manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: chowdhuryaj
      url-base: https://github.com/chowdhuryaj
    - name: urob
      url-base: https://github.com/urob
    - name: kot149
      url-base: https://github.com/kot149
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
    - name: tadakado
      url-base: https://github.com/tadakado
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: zzeneg
      url-base: https://github.com/zzeneg

  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned (main @ 2026-06-29) for reproducible builds; bump deliberately.
      revision: 484a0547078228f6957ed164523823e39fbedec4
      import: app/west.yml

    - name: zmk-keyboards
      remote: chowdhuryaj
      repo-path: Cyboard-ZMK-keyboards
      # main carries the imprint physical layout ZMK Studio needs
      # (flask-studio merged to main 2026-07-09 after bench pass).
      revision: main
      import: config/west.yml

    - name: zmk-adaptive-key
      remote: urob
      revision: main
      path: modules/zmk/adaptive-key

    # urob behavior modules track `main` — our zmk pin is main (post-v0.3),
    # and the v0.3 tags call pre-Studio keymap APIs (zmk_keymap_layer_activate
    # grew an argument; v0.3 auto-layer fails to compile the moment a node
    # references it).
    - name: zmk-auto-layer
      remote: urob
      revision: main

    - name: zmk-tri-state
      remote: urob
      revision: main

    # kot149/zmk-scroll-snap and oleksandrmaslov/zmk-pointing-acceleration
    # were dropped in the v9 parity round (2026-07-09): flask_scrollsnap and
    # flask_accel in zmk-flask-modules port the same engines with runtime
    # GUI tuning over the Flask protocol.

    - name: zmk-listeners
      remote: ssbb
      revision: v1

    - name: zmk-leader-key
      remote: urob
      revision: main

    - name: zmk-flask-modules
      remote: chowdhuryaj
      # flask-parity branch (stacked on flask-macros ← flask-combos) until
      # the rounds merge — repoint to main at merge (same dance as flask_rgb).
      revision: flask-parity

    - name: zmk-mouse-gesture
      remote: kot149
      revision: v1

    - name: zmk-ble-mouse-host
      remote: tadakado
      revision: main

    - name: zmk-switch-layout
      remote: mctechnology17
      revision: main

    - name: zmk-raw-hid
      remote: zzeneg
      revision: main

  self:
    path: config
