manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: chowdhuryaj
      url-base: https://github.com/chowdhuryaj
    - name: urob
      url-base: https://github.com/urob
    - name: kot149
      url-base: https://github.com/kot149
    - name: ssbb
      url-base: https://github.com/ssbb
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
    - name: tadakado
      url-base: https://github.com/tadakado
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: zzeneg
      url-base: https://github.com/zzeneg

  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned (main @ 2026-06-29) for reproducible builds; bump deliberately.
      revision: 484a0547078228f6957ed164523823e39fbedec4
      import: app/west.yml

    - name: zmk-keyboards
      remote: chowdhuryaj
      repo-path: Cyboard-ZMK-keyboards
      # flask-studio branch: adds the imprint physical layout ZMK Studio
      # needs. Merge to main after the Studio build is verified on-device.
      revision: flask-studio
      import: config/west.yml

    - name: zmk-adaptive-key
      remote: urob
      revision: main
      path: modules/zmk/adaptive-key

    - name: zmk-auto-layer
      remote: urob
      revision: v0.3

    - name: zmk-tri-state
      remote: urob
      revision: v0.3

    - name: zmk-scroll-snap
      remote: kot149
      revision: v1

    - name: zmk-listeners
      remote: ssbb
      revision: v1

    - name: zmk-leader-key
      remote: urob
      revision: main

    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      revision: main

    - name: zmk-flask-modules
      remote: chowdhuryaj
      revision: main

    - name: zmk-mouse-gesture
      remote: kot149
      revision: v1

    - name: zmk-ble-mouse-host
      remote: tadakado
      revision: main

    - name: zmk-switch-layout
      remote: mctechnology17
      revision: main

    - name: zmk-raw-hid
      remote: zzeneg
      revision: main

  self:
    path: config
